name: SonarQube Local Scan

on:
  push:
    branches: [ "main", "master", "dev" ]

jobs:
  sonar:
    name: Build and Analyze with SonarQube
    runs-on: self-hosted  # Chạy trực tiếp trên máy cá nhân của bạn

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Tránh lỗi thiếu lịch sử khi quét

      - name: Run SonarQube Scanner
        run: |
          echo "Bắt đầu quét mã nguồn bằng SonarQube..."
          sonar-scanner -Dsonar.projectKey=RealTimeChatApp -Dsonar.sources=. -Dsonar.host.url=http://localhost:32768 -Dsonar.token=BCSMAEE3MFWJRRHUK75AQJDK2ZD2Y